name: ci
on:
  push:
  pull_request:

jobs:
  core:
    # The planner, forms, worlds and mekh: standard library only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: pip install .
      - run: mekh plan code --parts 24 --input 20000 --output 3000 --stakes 5 --check exact --world kagamigakure --both
        env:
          PYTHONIOENCODING: utf-8

  with-gnomon:
    # Organisations keep their books in Gnomon: build it and run everything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 5kasgard/gnomon
          path: gnomon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # test_cards checks the Beta maths against scipy; without it the test skips
      - run: pip install scipy
      - run: bash scripts/build.sh
        working-directory: gnomon
      - run: python -m unittest discover -s tests -v
        env:
          GNOMON_PYTHON: ${{ github.workspace }}/gnomon/python
      # every recorded number and grade, recomputed (no network); and the queue
      - run: python bench/verify.py
      - run: python bench/queue.py --check
      - name: no test was skipped
        run: |
          GNOMON_PYTHON=$PWD/gnomon/python python -m unittest discover -s tests 2>&1 | tee out.txt
          ! grep -q "skipped=" out.txt
